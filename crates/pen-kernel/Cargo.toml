[package]
name = "pen-kernel"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "Small oracle-free verifier kernel for Law V2 proof artifacts"

[dependencies]
blake3 = "=1.8.3"
schemars = { version = "=1.2.1", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
thiserror = "=2.0.18"

[dev-dependencies]
serde_json = "=1.0.149"

[package.metadata.law-v2]
role = "production"
oracle_access = false
diagnostic_access = false
