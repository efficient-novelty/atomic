[package]
name = "pen-semantic-audit"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Isolated finite manifest-indexed GF2 semantic audit prototype"
publish = false

[workspace]
resolver = "2"

[dependencies]
pen-kernel = { path = "../pen-kernel" }
serde = { version = "=1.0.228", features = ["derive"] }
thiserror = "=2.0.18"

[dev-dependencies]
serde_json = "=1.0.149"

[package.metadata.law-v2]
role = "proposed-generic-audit"
oracle_access = false
diagnostic_access = false
live_profile_a_access = false
